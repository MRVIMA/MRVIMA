<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="VOIDVIMA">
  <title>VØIDVIMA — Embrace the nothing. Become everything.</title>

  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#E10600" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#5c0000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="edgeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E10600" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edgeR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#E10600" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.05"/>
    </pattern>

    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
    </filter>

    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>

    <clipPath id="band1"><rect x="0" y="120" width="1200" height="16"/></clipPath>
    <clipPath id="band2"><rect x="0" y="158" width="1200" height="11"/></clipPath>
    <clipPath id="band3"><rect x="0" y="182" width="1200" height="14"/></clipPath>

    <style><![CDATA[
      .wordmark {
        font-family: "Arial Black", "Helvetica Neue", Impact, sans-serif;
        font-weight: 900; font-size: 96px; letter-spacing: 10px; text-anchor: middle;
      }
      .sub {
        font-family: "Courier New", Consolas, monospace;
        font-size: 17px; letter-spacing: 8px; text-anchor: middle; fill: #d8d8d8;
      }
      .hud { font-family: "Courier New", monospace; font-size: 9px; fill: #E10600; opacity: .75; letter-spacing: 2px; }

      @keyframes flicker {
        0%,88%,100% { opacity: 1 }
        89% { opacity: .28 } 90% { opacity: 1 }
        95% { opacity: .55 } 96% { opacity: 1 }
      }
      @keyframes ghostL {
        0%,100% { transform: translate(0,0) } 12% { transform: translate(-7px,2px) }
        13% { transform: translate(0,0) } 62% { transform: translate(-4px,-2px) } 64% { transform: translate(0,0) }
      }
      @keyframes ghostR {
        0%,100% { transform: translate(0,0) } 12% { transform: translate(7px,-2px) }
        13% { transform: translate(0,0) } 62% { transform: translate(5px,2px) } 64% { transform: translate(0,0) }
      }
      @keyframes tearA {
        0%,20%,100% { transform: translateX(0) } 21% { transform: translateX(-26px) }
        23% { transform: translateX(14px) } 25% { transform: translateX(0) }
      }
      @keyframes tearB {
        0%,54%,100% { transform: translateX(0) } 55% { transform: translateX(22px) }
        57% { transform: translateX(-18px) } 59% { transform: translateX(0) }
      }
      @keyframes tearC {
        0%,76%,100% { transform: translateX(0) } 77% { transform: translateX(-16px) } 80% { transform: translateX(0) }
      }
      @keyframes sweep { 0% { transform: translateY(-40px) } 100% { transform: translateY(360px) } }
      @keyframes pulse { 0%,100% { opacity: .25 } 50% { opacity: .7 } }
      @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }

      .flick  { animation: flicker 6s infinite steps(1) }
      .gl     { animation: ghostL 5.5s infinite steps(1) }
      .gr     { animation: ghostR 5.5s infinite steps(1) }
      .t1     { animation: tearA 4.2s infinite steps(1) }
      .t2     { animation: tearB 4.2s infinite steps(1) }
      .t3     { animation: tearC 4.2s infinite steps(1) }
      .sweep  { animation: sweep 7s linear infinite }
      .breathe{ animation: pulse 3.4s ease-in-out infinite }
      .blink  { animation: blink 1.1s steps(1) infinite }
    ]]></style>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="320" fill="#050505"/>
  <rect width="1200" height="320" fill="url(#glow)"/>
  <rect x="0" y="0" width="220" height="320" fill="url(#edgeL)" class="breathe"/>
  <rect x="980" y="0" width="220" height="320" fill="url(#edgeR)" class="breathe"/>

  <!-- crown mark -->
  <g transform="translate(600,62)" fill="none" stroke="#E10600" stroke-width="3" stroke-linecap="square">
    <path d="M-26,10 L-26,-10 L-13,4 L0,-16 L13,4 L26,-10 L26,10 Z"/>
    <path d="M0,10 L0,22"/>
  </g>

  <!-- wordmark stack -->
  <g class="flick">
    <text class="wordmark gl" x="600" y="186" fill="#8B0000" opacity="0.9">VØIDVIMA</text>
    <text class="wordmark gr" x="600" y="186" fill="#E10600" opacity="0.9">VØIDVIMA</text>
    <text class="wordmark"    x="600" y="186" fill="#F5F5F5">VØIDVIMA</text>

    <g clip-path="url(#band1)" class="t1"><text class="wordmark" x="600" y="186" fill="#E10600">VØIDVIMA</text></g>
    <g clip-path="url(#band2)" class="t2"><text class="wordmark" x="600" y="186" fill="#ffffff">VØIDVIMA</text></g>
    <g clip-path="url(#band3)" class="t3"><text class="wordmark" x="600" y="186" fill="#E10600">VØIDVIMA</text></g>
  </g>

  <!-- tagline -->
  <text class="sub" x="600" y="232">EMBRACE THE NOTHING.<tspan fill="#E10600"> BECOME EVERYTHING.</tspan></text>

  <!-- rules -->
  <rect x="180" y="252" width="840" height="1" fill="#E10600" opacity="0.5"/>
  <rect x="180" y="252" width="90" height="1" fill="#ffffff" class="blink"/>

  <!-- HUD furniture -->
  <g stroke="#E10600" stroke-width="2" fill="none" opacity="0.85">
    <path d="M24,24 L24,64 M24,24 L64,24"/>
    <path d="M1176,24 L1176,64 M1176,24 L1136,24"/>
    <path d="M24,296 L24,256 M24,296 L64,296"/>
    <path d="M1176,296 L1176,256 M1176,296 L1136,296"/>
  </g>
  <text class="hud" x="40" y="90">SYS//VOID.0x1</text>
  <text class="hud" x="40" y="104">SIGNAL: CORRUPTED</text>
  <text class="hud" x="1160" y="90" text-anchor="end">CARDIFF MET // SE</text>
  <text class="hud" x="1160" y="104" text-anchor="end">LAT 6.7730 LON 79.8816</text>

  <g fill="#E10600" opacity="0.8">
    <rect x="1040" y="278" width="3" height="10"/><rect x="1047" y="278" width="6" height="10"/>
    <rect x="1057" y="278" width="2" height="10"/><rect x="1063" y="278" width="8" height="10"/>
    <rect x="1075" y="278" width="3" height="10"/><rect x="1082" y="278" width="5" height="10"/>
    <rect x="1091" y="278" width="2" height="10"/><rect x="1097" y="278" width="7" height="10"/>
  </g>

  <!-- overlays -->
  <rect width="1200" height="320" fill="url(#scan)"/>
  <rect class="sweep" width="1200" height="30" fill="#E10600" opacity="0.10" filter="url(#soft)"/>
  <rect width="1200" height="320" filter="url(#grain)" opacity="0.5"/>
  <rect x="1" y="1" width="1198" height="318" fill="none" stroke="#E10600" stroke-width="2" opacity="0.55"/>
</svg>
