<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" width="900" height="140" role="img" aria-label="Telemetry console">
  <title>TELEMETRY CONSOLE</title>
  <defs>
    <clipPath id="p"><rect x="1" y="1" width="898" height="138" rx="10"/></clipPath>
    <linearGradient id="barG" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#5c0000"/>
      <stop offset="100%" stop-color="#FF2B20"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.035"/>
    </pattern>
    <style><![CDATA[
      .mono { font-family:"SFMono-Regular","Consolas","Liberation Mono","Courier New",monospace; }
    ]]></style>
  </defs>

  <g clip-path="url(#p)">
    <rect width="900" height="140" fill="#0A0A0A"/>
    <rect width="900" height="28" fill="#151515"/>
    <rect y="27" width="900" height="1" fill="#E10600" opacity="0.5"/>
    <text class="mono" x="16" y="19" fill="#E10600" font-size="10" font-weight="700" letter-spacing="3">TELEMETRY CONSOLE</text>
    <text class="mono" x="884" y="19" text-anchor="end" fill="#6a6a6a" font-size="10" letter-spacing="2">v0.1 &#183; MRVIMA</text>

    <!-- left readout -->
    <text class="mono" x="20" y="66" fill="#F5F5F5" font-size="19" font-weight="700" letter-spacing="4">SELECT A CHANNEL</text>
    <text class="mono" x="20" y="88" fill="#8B0000" font-size="10" letter-spacing="3">EXPAND ANY PANEL BELOW TO PULL LIVE DATA</text>
    <g>
      <circle cx="26" cy="112" r="4" fill="#E10600">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <text class="mono" x="38" y="116" fill="#B9B9B9" font-size="10" letter-spacing="2">LIVE FEED</text>
    </g>

    <!-- equalizer -->
    <g fill="url(#barG)">
      <rect x="430" y="86" width="9" height="30"><animate attributeName="height" values="30;54;12;44;22;30" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="86;62;104;72;94;86" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="446" y="70" width="9" height="46"><animate attributeName="height" values="46;14;52;24;40;46" dur="1.7s" repeatCount="indefinite"/><animate attributeName="y" values="70;102;64;92;76;70" dur="1.7s" repeatCount="indefinite"/></rect>
      <rect x="462" y="96" width="9" height="20"><animate attributeName="height" values="20;48;30;56;16;20" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="96;68;86;60;100;96" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="478" y="78" width="9" height="38"><animate attributeName="height" values="38;20;50;28;46;38" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="78;96;66;88;70;78" dur="1.5s" repeatCount="indefinite"/></rect>
      <rect x="494" y="90" width="9" height="26"><animate attributeName="height" values="26;52;18;40;32;26" dur="1.9s" repeatCount="indefinite"/><animate attributeName="y" values="90;64;98;76;84;90" dur="1.9s" repeatCount="indefinite"/></rect>
      <rect x="510" y="66" width="9" height="50"><animate attributeName="height" values="50;22;44;16;54;50" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="66;94;72;100;62;66" dur="1.2s" repeatCount="indefinite"/></rect>
      <rect x="526" y="84" width="9" height="32"><animate attributeName="height" values="32;46;20;52;26;32" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y" values="84;70;96;64;90;84" dur="1.6s" repeatCount="indefinite"/></rect>
      <rect x="542" y="98" width="9" height="18"><animate attributeName="height" values="18;40;30;48;22;18" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="98;76;86;68;94;98" dur="1.4s" repeatCount="indefinite"/></rect>
      <rect x="558" y="74" width="9" height="42"><animate attributeName="height" values="42;18;54;30;38;42" dur="1.8s" repeatCount="indefinite"/><animate attributeName="y" values="74;98;62;86;78;74" dur="1.8s" repeatCount="indefinite"/></rect>
      <rect x="574" y="92" width="9" height="24"><animate attributeName="height" values="24;50;16;42;34;24" dur="1.05s" repeatCount="indefinite"/><animate attributeName="y" values="92;66;100;74;82;92" dur="1.05s" repeatCount="indefinite"/></rect>
      <rect x="590" y="80" width="9" height="36"><animate attributeName="height" values="36;24;48;20;44;36" dur="1.55s" repeatCount="indefinite"/><animate attributeName="y" values="80;92;68;96;72;80" dur="1.55s" repeatCount="indefinite"/></rect>
      <rect x="606" y="88" width="9" height="28"><animate attributeName="height" values="28;44;14;50;30;28" dur="1.25s" repeatCount="indefinite"/><animate attributeName="y" values="88;72;102;66;86;88" dur="1.25s" repeatCount="indefinite"/></rect>
    </g>
    <rect x="428" y="118" width="192" height="1" fill="#8B0000" opacity="0.6"/>
    <text class="mono" x="524" y="132" text-anchor="middle" fill="#5a5a5a" font-size="8" letter-spacing="3">OUTPUT LEVEL</text>

    <!-- radar -->
    <g transform="translate(790,80)">
      <circle r="36" fill="none" stroke="#3a0000" stroke-width="1"/>
      <circle r="24" fill="none" stroke="#3a0000" stroke-width="1"/>
      <circle r="12" fill="none" stroke="#3a0000" stroke-width="1"/>
      <line x1="-36" y1="0" x2="36" y2="0" stroke="#3a0000" stroke-width="1"/>
      <line x1="0" y1="-36" x2="0" y2="36" stroke="#3a0000" stroke-width="1"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.4s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="0" y2="-36" stroke="#E10600" stroke-width="2"/>
        <path d="M0,0 L0,-36 A36,36 0 0,0 -22,-28 Z" fill="#E10600" opacity="0.25"/>
      </g>
      <circle cx="14" cy="-18" r="2.5" fill="#E10600"><animate attributeName="opacity" values="0;1;0" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="-20" cy="10" r="2.5" fill="#E10600"><animate attributeName="opacity" values="1;0;1" dur="3.4s" repeatCount="indefinite"/></circle>
    </g>

    <rect width="900" height="140" fill="url(#scan)"/>
  </g>
  <rect x="1" y="1" width="898" height="138" rx="10" fill="none" stroke="#E10600" stroke-width="2" opacity="0.6"/>
</svg>
