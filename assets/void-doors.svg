<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Two doors">
  <title>The corridor splits — two doors</title>
  <defs>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="soft2"><feGaussianBlur stdDeviation="5"/></filter>
    <linearGradient id="spill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E10600" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#E10600" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="doorRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF2B20"/>
      <stop offset="100%" stop-color="#6b0000"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.04"/>
    </pattern>
    <style><![CDATA[
      .mono { font-family:"SFMono-Regular","Consolas","Liberation Mono","Courier New",monospace; }
    ]]></style>
  </defs>

  <rect width="900" height="260" fill="#070707"/>

  <!-- floor perspective -->
  <g stroke="#3a0000" stroke-width="1" opacity="0.7">
    <path d="M450,120 L60,260"/><path d="M450,120 L200,260"/><path d="M450,120 L340,260"/>
    <path d="M450,120 L560,260"/><path d="M450,120 L700,260"/><path d="M450,120 L840,260"/>
    <path d="M0,206 L900,206"/><path d="M0,232 L900,232"/>
  </g>

  <!-- light spill from red door -->
  <polygon points="200,214 320,214 400,260 120,260" fill="url(#spill)" filter="url(#soft2)">
    <animate attributeName="opacity" values="0.85;0.45;0.95;0.6;0.85" dur="2.4s" repeatCount="indefinite"/>
  </polygon>

  <!-- RED DOOR -->
  <g>
    <rect x="185" y="34" width="150" height="182" rx="4" fill="#E10600" opacity="0.35" filter="url(#soft)">
      <animate attributeName="opacity" values="0.45;0.2;0.5;0.28;0.45" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="196" y="44" width="128" height="170" rx="3" fill="url(#doorRed)"/>
    <rect x="196" y="44" width="128" height="170" rx="3" fill="none" stroke="#FF6B60" stroke-width="1.5" opacity="0.8"/>
    <rect x="186" y="34" width="148" height="190" rx="4" fill="none" stroke="#E10600" stroke-width="2"/>
    <text class="mono" x="260" y="240" text-anchor="middle" fill="#E10600" font-size="12" font-weight="700" letter-spacing="3">RED DOOR</text>
    <text class="mono" x="260" y="256" text-anchor="middle" fill="#7a7a7a" font-size="9" letter-spacing="2">THE LOUD ONE</text>
  </g>

  <!-- BLACK DOOR -->
  <g>
    <rect x="566" y="44" width="128" height="170" rx="3" fill="#0C0C0C"/>
    <rect x="566" y="44" width="128" height="170" rx="3" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
    <rect x="556" y="34" width="148" height="190" rx="4" fill="none" stroke="#4a4a4a" stroke-width="2" opacity="0.7"/>
    <rect x="620" y="118" width="20" height="2" fill="#E10600" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <text class="mono" x="630" y="240" text-anchor="middle" fill="#9a9a9a" font-size="12" font-weight="700" letter-spacing="3">BLACK DOOR</text>
    <text class="mono" x="630" y="256" text-anchor="middle" fill="#5a5a5a" font-size="9" letter-spacing="2">THE QUIET ONE</text>
  </g>

  <!-- centre prompt -->
  <text class="mono" x="450" y="96" text-anchor="middle" fill="#F5F5F5" font-size="13" font-weight="700" letter-spacing="6">CHOOSE</text>
  <text class="mono" x="450" y="116" text-anchor="middle" fill="#8B0000" font-size="9" letter-spacing="3">NO LIGHTS &#183; NO EXITS &#183; NO RETURN</text>
  <path d="M450,130 L450,150 M444,144 L450,151 L456,144" stroke="#E10600" stroke-width="1.5" fill="none">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
  </path>

  <rect width="900" height="260" fill="url(#scan)"/>
  <rect x="1" y="1" width="898" height="258" fill="none" stroke="#E10600" stroke-width="2" opacity="0.45"/>
</svg>
