<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 108" width="900" height="108" role="img" aria-label="ENTER THE VOID">
  <title>ENTER THE VOID</title>
  <defs>
    <pattern id="hazard" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#0A0A0A"/>
      <rect width="8" height="16" fill="#E10600"/>
    </pattern>
    <clipPath id="plate"><rect x="1" y="1" width="898" height="106" rx="10"/></clipPath>
    <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <style><![CDATA[
      .mono { font-family: "SFMono-Regular","Consolas","Liberation Mono","Courier New",monospace; }
      .huge { font-family: "Arial Black","Helvetica Neue",Impact,sans-serif; font-weight:900; font-size:34px; letter-spacing:14px; }
    ]]></style>
  </defs>

  <g clip-path="url(#plate)">
    <rect width="900" height="108" fill="#0A0A0A"/>

    <!-- hazard ends -->
    <rect x="0" y="0" width="86" height="108" fill="url(#hazard)" opacity="0.55"/>
    <rect x="814" y="0" width="86" height="108" fill="url(#hazard)" opacity="0.55"/>

    <!-- red bloom behind text -->
    <ellipse cx="450" cy="54" rx="230" ry="34" fill="#E10600" opacity="0.22" filter="url(#blur)">
      <animate attributeName="opacity" values="0.12;0.34;0.12" dur="3.2s" repeatCount="indefinite"/>
    </ellipse>

    <!-- crown mark -->
    <g transform="translate(160,54)" fill="none" stroke="#E10600" stroke-width="2.5" stroke-linecap="square">
      <path d="M-18,7 L-18,-7 L-9,3 L0,-11 L9,3 L18,-7 L18,7 Z"/>
    </g>
    <g transform="translate(740,54)" fill="none" stroke="#E10600" stroke-width="2.5" stroke-linecap="square">
      <path d="M-18,7 L-18,-7 L-9,3 L0,-11 L9,3 L18,-7 L18,7 Z"/>
    </g>

    <!-- wordmark -->
    <text class="huge" x="450" y="58" text-anchor="middle" fill="#F5F5F5">ENTER THE VOID
      <animate attributeName="opacity" values="1;1;0.45;1;1" keyTimes="0;0.82;0.85;0.88;1" dur="5s" repeatCount="indefinite"/>
    </text>
    <text class="mono" x="450" y="84" text-anchor="middle" fill="#E10600" font-size="10" letter-spacing="5">CLEARANCE: NONE &#183; CLICK TO PROCEED &#183; YOU SHOULDN&#39;T</text>

    <!-- sweep -->
    <rect x="-260" y="0" width="260" height="108" fill="url(#fade)">
      <animate attributeName="x" values="-260;900" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="898" height="106" rx="10" fill="none" stroke="#E10600" stroke-width="2" opacity="0.7"/>
</svg>
