<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="VOID.SYS boot sequence">
  <title>VOID.SYS — boot sequence</title>

  <defs>
    <clipPath id="win"><rect x="1" y="1" width="898" height="338" rx="12"/></clipPath>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.035"/>
    </pattern>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B0000"/>
      <stop offset="50%" stop-color="#E10600"/>
      <stop offset="100%" stop-color="#8B0000"/>
    </linearGradient>
    <style><![CDATA[
      .mono  { font-family: "SFMono-Regular", "Consolas", "Liberation Mono", "Courier New", monospace; font-size: 14px; }
      .label { fill: #B9B9B9; }
      .val   { fill: #E10600; font-weight: 700; }
      .dim   { fill: #8B0000; font-weight: 700; }
      .arrow { fill: #E10600; font-weight: 700; }
      .tbar  { fill: #7a7a7a; font-size: 12px; letter-spacing: 1px; }
    ]]></style>
  </defs>

  <g clip-path="url(#win)">
    <rect width="900" height="340" fill="#0A0A0A"/>

    <!-- title bar -->
    <rect width="900" height="38" fill="#151515"/>
    <rect y="37" width="900" height="1" fill="#E10600" opacity="0.55"/>
    <circle cx="26" cy="19" r="5.5" fill="#E10600"/>
    <circle cx="46" cy="19" r="5.5" fill="#8B0000"/>
    <circle cx="66" cy="19" r="5.5" fill="#3a0000"/>
    <text class="mono tbar" x="450" y="24" text-anchor="middle">void@sys — /root/vimukthi — bash</text>

    <!-- boot lines -->
    <g class="mono">
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.05;0.07;1" dur="10s" repeatCount="indefinite"/>
        <text class="arrow" x="28" y="82">&gt;</text>
        <text class="label" x="50" y="82">INITIALIZING VOID.SYS</text>
        <line x1="262" y1="78" x2="470" y2="78" stroke="#5a1414" stroke-width="1" stroke-dasharray="2 6"/>
        <text class="val" x="482" y="82">OK</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.13;0.15;1" dur="10s" repeatCount="indefinite"/>
        <text class="arrow" x="28" y="112">&gt;</text>
        <text class="label" x="50" y="112">OPERATOR</text>
        <line x1="262" y1="108" x2="470" y2="108" stroke="#5a1414" stroke-width="1" stroke-dasharray="2 6"/>
        <text class="val" x="482" y="112">VIMUKTHI HEWAGE</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.21;0.23;1" dur="10s" repeatCount="indefinite"/>
        <text class="arrow" x="28" y="142">&gt;</text>
        <text class="label" x="50" y="142">STACK MOUNTED</text>
        <line x1="262" y1="138" x2="470" y2="138" stroke="#5a1414" stroke-width="1" stroke-dasharray="2 6"/>
        <text class="val" x="482" y="142">JAVA / PYTHON / LUA / C# / JS</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.29;0.31;1" dur="10s" repeatCount="indefinite"/>
        <text class="arrow" x="28" y="172">&gt;</text>
        <text class="label" x="50" y="172">CREATIVE MODULE</text>
        <line x1="262" y1="168" x2="470" y2="168" stroke="#5a1414" stroke-width="1" stroke-dasharray="2 6"/>
        <text class="val" x="482" y="172">VOIDVIMA.dll</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.37;0.39;1" dur="10s" repeatCount="indefinite"/>
        <text class="arrow" x="28" y="202">&gt;</text>
        <text class="label" x="50" y="202">HUMANITY.exe</text>
        <line x1="262" y1="198" x2="470" y2="198" stroke="#5a1414" stroke-width="1" stroke-dasharray="2 6"/>
        <text class="dim" x="482" y="202">NOT FOUND</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.45;0.47;1" dur="10s" repeatCount="indefinite"/>
        <text class="arrow" x="28" y="232">&gt;</text>
        <text class="label" x="50" y="232">STATUS</text>
        <line x1="262" y1="228" x2="470" y2="228" stroke="#5a1414" stroke-width="1" stroke-dasharray="2 6"/>
        <text class="val" x="482" y="232">ONLINE</text>
        <circle cx="576" cy="227" r="4" fill="#E10600">
          <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- live prompt -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.53;0.55;1" dur="10s" repeatCount="indefinite"/>
        <text class="arrow" x="28" y="266">&gt;</text>
        <text class="label" x="50" y="266">_</text>
        <rect x="62" y="254" width="9" height="16" fill="#E10600">
          <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- status bar -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.60;0.63;1" dur="10s" repeatCount="indefinite"/>
      <rect y="288" width="900" height="52" fill="url(#bar)"/>
      <text class="mono" x="450" y="319" text-anchor="middle" fill="#0A0A0A" font-weight="700" font-size="15" letter-spacing="4">EMBRACE THE NOTHING. BECOME EVERYTHING.</text>
    </g>

    <rect width="900" height="340" fill="url(#scan)"/>
  </g>

  <rect x="1" y="1" width="898" height="338" rx="12" fill="none" stroke="#E10600" stroke-width="2" opacity="0.6"/>
</svg>
